services:
  - type: web
    name: travelcompanion-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/JuanBZ92/TravelCompanion
    branch: newapproach
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: travelcompanion-db
          property: connectionString
      - key: OpenAI__Enabled
        value: "false"
      - key: AdminAuth__Username
        sync: false
      - key: AdminAuth__Password
        sync: false
      - key: FreePreview__MarkerObfuscationKey
        generateValue: true

databases:
  - name: travelcompanion-db
    databaseName: travel_companion
    user: travel_companion
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
