services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-companion-postgres
    environment:
      POSTGRES_DB: travel_companion
      POSTGRES_USER: travel_companion
      POSTGRES_PASSWORD: travel_companion_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
