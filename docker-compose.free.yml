# Usage: docker compose -f docker-compose.yml -f docker-compose.free.yml up --build
# Local development only. Production credentials are deliberately not included.
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_companion -d travel_companion"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
  api:
    build: .
    ports:
      - "5289:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TravelCompanionDb: Host=postgres;Port=5432;Database=travel_companion;Username=travel_companion;Password=travel_companion_dev
      Database__ApplyMigrationsOnStartup: "true"
      OpenAI__Enabled: "false"
      GooglePlaces__Enabled: "false"
      GoogleRoutes__Enabled: "false"
      StorePurchases__NewPurchasesEnabled: "false"
      DataProtection__KeysPath: /data/keys
    volumes:
      - free-development-keys:/data/keys
volumes:
  free-development-keys:
