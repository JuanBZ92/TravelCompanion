trigger:
  branches:
    include:
    - master
    - main
    - develop

pr:
  branches:
    include:
    - master
    - main
    - develop

parameters:
- name: runTerraformPlan
  displayName: Run Terraform plan
  type: boolean
  default: false

variables:
  buildConfiguration: Release
  dotnetSdkVersion: 10.0.x
  terraformVersion: 1.8.5
  terraformWorkingDirectory: infra/terraform
  vmImageName: ubuntu-22.04
  azureServiceConnection: TODO-AZURE-SERVICE-CONNECTION
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages

resources:
  containers:
  - container: postgres
    image: postgres:16.4
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: travel_companion_ci
    ports:
    - 5432:5432

stages:
- stage: Build
  displayName: Build API
  jobs:
  - job: BuildApi
    displayName: Restore and build API
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 20
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)

    - task: Cache@2
      displayName: Cache NuGet packages
      inputs:
        key: 'nuget | "$(Agent.OS)" | **/*.csproj'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.nuget/packages

    - script: dotnet restore src/TravelCompanion.Api/TravelCompanion.Api.csproj
      displayName: Restore API

    - script: dotnet build src/TravelCompanion.Api/TravelCompanion.Api.csproj --configuration $(buildConfiguration) --no-restore
      displayName: Build API

    - script: dotnet restore src/TravelCompanion.Notifications.Worker/TravelCompanion.Notifications.Worker.csproj
      displayName: Restore notifications worker

    - script: dotnet build src/TravelCompanion.Notifications.Worker/TravelCompanion.Notifications.Worker.csproj --configuration $(buildConfiguration) --no-restore
      displayName: Build notifications worker

    - script: dotnet restore tests/TravelCompanion.Shared.Tests/TravelCompanion.Shared.Tests.csproj
      displayName: Restore shared tests

    - script: dotnet restore tests/TravelCompanion.Api.Tests/TravelCompanion.Api.Tests.csproj
      displayName: Restore API tests

    - script: dotnet restore tests/TravelCompanion.Mobile.Tests/TravelCompanion.Mobile.Tests.csproj
      displayName: Restore mobile tests

    - script: dotnet test tests/TravelCompanion.Shared.Tests/TravelCompanion.Shared.Tests.csproj --configuration $(buildConfiguration) --no-restore --verbosity minimal --logger "trx;LogFileName=shared-tests.trx"
      displayName: Test shared rules

    - script: dotnet test tests/TravelCompanion.Api.Tests/TravelCompanion.Api.Tests.csproj --configuration $(buildConfiguration) --no-restore --verbosity minimal --logger "trx;LogFileName=api-tests.trx"
      displayName: Test API/admin rules

    - script: dotnet test tests/TravelCompanion.Mobile.Tests/TravelCompanion.Mobile.Tests.csproj --configuration $(buildConfiguration) --no-restore --verbosity minimal --logger "trx;LogFileName=mobile-tests.trx"
      displayName: Test mobile assistant presentation

    - task: PublishTestResults@2
      displayName: Publish application test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*-tests.trx'
        failTaskOnFailedTests: true

- stage: RelationalAndMobile
  displayName: Validate PostgreSQL and mobile builds
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: PostgreSqlTests
    displayName: Run required PostgreSQL tests
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 25
    services:
      postgres: postgres
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)

    - task: Cache@2
      displayName: Cache NuGet packages
      inputs:
        key: 'nuget | "$(Agent.OS)" | **/*.csproj'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.nuget/packages

    - script: dotnet restore tests/TravelCompanion.Api.Tests/TravelCompanion.Api.Tests.csproj
      displayName: Restore PostgreSQL tests

    - bash: |
        set -euo pipefail
        for attempt in $(seq 1 30); do
          if pg_isready -h localhost -p 5432 -U postgres; then
            exit 0
          fi
          sleep 1
        done
        echo "PostgreSQL did not become ready." >&2
        exit 1
      displayName: Require PostgreSQL service

    - pwsh: |
        # Use the service's tools so pg_dump matches the server version.
        $containers = $env:AGENT_CONTAINERMAPPING | ConvertFrom-Json
        $env:TRAVELCOMPANION_TEST_POSTGRES_CONTAINER = $containers.postgres.id
        if ([string]::IsNullOrWhiteSpace($env:TRAVELCOMPANION_TEST_POSTGRES_CONTAINER)) {
          throw 'PostgreSQL service container mapping is missing.'
        }
        dotnet test tests/TravelCompanion.Api.Tests/TravelCompanion.Api.Tests.csproj --configuration $(buildConfiguration) --no-restore --verbosity minimal --filter "FullyQualifiedName~Postgres" --logger "trx;LogFileName=postgres-tests.trx"
        exit $LASTEXITCODE
      displayName: Test PostgreSQL migrations and concurrency
      env:
        TRAVELCOMPANION_TEST_POSTGRES: Host=localhost;Port=5432;Database=travel_companion_ci;Username=postgres;Pooling=false

    - task: PublishTestResults@2
      displayName: Publish PostgreSQL test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/postgres-tests.trx'
        failTaskOnFailedTests: true

  - job: AndroidBuild
    displayName: Build Android application
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 35
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)

    - script: dotnet workload install maui-android
      displayName: Install Android workload

    - script: dotnet restore src/TravelCompanion.Mobile/TravelCompanion.Mobile.csproj -p:TargetFramework=net10.0-android
      displayName: Restore Android application

    - script: dotnet build src/TravelCompanion.Mobile/TravelCompanion.Mobile.csproj --configuration $(buildConfiguration) --framework net10.0-android --no-restore
      displayName: Build Android application

  - job: IosBuild
    displayName: Build iOS simulator application
    pool:
      vmImage: macOS-15
    timeoutInMinutes: 35
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)

    - script: dotnet workload install maui-ios
      displayName: Install iOS workload

    - script: dotnet restore src/TravelCompanion.Mobile/TravelCompanion.Mobile.csproj -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier=iossimulator-x64 -p:PlatformTarget=x64
      displayName: Restore iOS simulator application

    - script: dotnet build src/TravelCompanion.Mobile/TravelCompanion.Mobile.csproj --configuration $(buildConfiguration) --framework net10.0-ios --no-restore -p:RuntimeIdentifier=iossimulator-x64 -p:PlatformTarget=x64 -p:CodesignKey= -p:CodesignProvision= -p:CodesignRequireProvisioningProfile=false
      displayName: Build iOS simulator application

- stage: TerraformValidate
  displayName: Validate Terraform
  jobs:
  - job: TerraformValidate
    displayName: Format and validate Terraform
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 15
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - script: |
        set -euo pipefail
        curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -q terraform.zip
        sudo mv terraform /usr/local/bin/terraform
        terraform version
      displayName: Install Terraform

    - script: terraform fmt -check -recursive
      displayName: Check Terraform formatting
      workingDirectory: $(terraformWorkingDirectory)

    - script: terraform init -backend=false
      displayName: Init Terraform without backend
      workingDirectory: $(terraformWorkingDirectory)

    - script: terraform validate
      displayName: Validate Terraform configuration
      workingDirectory: $(terraformWorkingDirectory)

- stage: ReleaseCandidate
  displayName: Package validated release candidate
  dependsOn:
  - Build
  - RelationalAndMobile
  - TerraformValidate
  condition: succeeded()
  jobs:
  - job: Package
    displayName: Package API and explicit migrations
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 20
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)
    - script: dotnet publish src/TravelCompanion.Api/TravelCompanion.Api.csproj --configuration $(buildConfiguration) --output "$(Build.ArtifactStagingDirectory)/release/api" --verbosity minimal
      displayName: Publish validated API
    - script: dotnet tool restore
      displayName: Restore pinned migration tools
    - script: dotnet tool run dotnet-ef migrations script --idempotent --project src/TravelCompanion.Api --configuration $(buildConfiguration) --no-build --output "$(Build.ArtifactStagingDirectory)/release/migrations.sql"
      displayName: Generate explicit migration script
    - script: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/TravelCompanion.Api --configuration $(buildConfiguration) --no-build
      displayName: Require migration coverage for model changes
    - pwsh: |
        $releasePath = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'release'
        @{ commit = $env:BUILD_SOURCEVERSION; buildId = $env:BUILD_BUILDID; branch = $env:BUILD_SOURCEBRANCH } |
          ConvertTo-Json | Set-Content (Join-Path $releasePath 'manifest.json')
      displayName: Record exact source revision
    - task: PublishPipelineArtifact@1
      displayName: Publish release candidate after all required gates
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/release
        artifact: validated-release
        publishLocation: pipeline

- ${{ if eq(parameters.runTerraformPlan, true) }}:
  - stage: TerraformPlan
    displayName: Plan Terraform
    dependsOn:
    - Build
    - TerraformValidate
    condition: succeeded()
    jobs:
    - job: TerraformPlan
      displayName: Create dev plan
      pool:
        vmImage: $(vmImageName)
      timeoutInMinutes: 20
      steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - script: |
          set -euo pipefail
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
          unzip -q terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          terraform version
        displayName: Install Terraform

      - task: AzureCLI@2
        displayName: Terraform plan only
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: $(terraformWorkingDirectory)
          inlineScript: |
            set -euo pipefail
            terraform init
            terraform plan \
              -out="$(Build.ArtifactStagingDirectory)/travel-companion-dev.tfplan" \
              -var="environment=dev" \
              -var="allow_paid_resources=false"

      - task: PublishPipelineArtifact@1
        displayName: Publish Terraform plan artifact
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/travel-companion-dev.tfplan
          artifact: terraform-plan-dev
          publishLocation: pipeline
